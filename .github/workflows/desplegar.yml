# Despliegue a un entorno (F4-06a, O-5, D-07). Solo lo llama ci.yml, después de `ci-ok`, en un push
# a `main` (WF-02 prohíbe workflow_run: por eso no es un workflow aparte con su propio trigger).
#
# Orden (runbook R-1): migraciones → build en el runner → despliegue SIN dominio (--skip-domain) →
# humo contra la URL del despliegue → promover → humo contra el origen estable → si falla, rollback.
# El schema no se revierte (R-2): toda migración es compatible con el código anterior (O-5).
#
# Dos proyectos de Vercel (F4-06a-D1): `staging` y `production` son environments de GitHub, cada uno
# con su VERCEL_PROJECT_ID. Los dos solo aceptan la rama `main` (regla del environment, no de este
# archivo). Secretos del environment: DB_OWNER_URL, VERCEL_TOKEN, VERCEL_AUTOMATION_BYPASS.
# Variables: APP_ORIGIN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#
# Mismas reglas WF-01 a WF-04 que ci.yml (tests/politicas/workflows.test.ts) y las de
# tests/politicas/despliegue.test.ts. Vercel CLI se instala con npm a una versión exacta, sin acción
# de terceros (≥ 65.8.0 para funciones con Node 26 en despliegues prebuilt).
name: Desplegar

on:
  workflow_call:
    inputs:
      entorno:
        description: Environment de GitHub (staging o production)
        required: true
        type: string
    # Los valores salen del environment que declara el job (prevalece sobre lo que pase ci.yml), pero
    # el contexto `secrets` de un workflow reutilizable solo ve los secretos declarados aquí y pasados
    # por quien llama. Sin esto llegan vacíos (primera corrida, 2026-11-25). Sin `secrets: inherit`.
    secrets:
      DB_OWNER_URL:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_AUTOMATION_BYPASS:
        required: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"
  CI: "true"
  VERCEL_CLI_VERSION: "66.6.0"

jobs:
  desplegar:
    name: Desplegar a ${{ inputs.entorno }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.entorno }}
      url: ${{ vars.APP_ORIGIN }}
    # Un despliegue por entorno a la vez; uno en curso nunca se cancela (dejaría la base migrada a medias).
    concurrency:
      group: desplegar-${{ inputs.entorno }}
      cancel-in-progress: false
    env:
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Inicio
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: El environment está completo
        env:
          HAY_DB: ${{ secrets.DB_OWNER_URL != '' }}
          HAY_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAY_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS != '' }}
        run: |
          faltan=""
          [ "${HAY_DB}" = "true" ] || faltan="${faltan} DB_OWNER_URL"
          [ "${HAY_TOKEN}" = "true" ] || faltan="${faltan} VERCEL_TOKEN"
          [ "${HAY_BYPASS}" = "true" ] || faltan="${faltan} VERCEL_AUTOMATION_BYPASS"
          [ -n "${VERCEL_ORG_ID}" ] || faltan="${faltan} VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID}" ] || faltan="${faltan} VERCEL_PROJECT_ID"
          [ -n "${faltan}" ] && { echo "::error::Faltan en el environment:${faltan}"; exit 1; }
          # Sin dominio propio hasta la beta (O-13): el origen es un subdominio de vercel.app.
          echo "${APP_ORIGIN}" | grep -Eq '^https://[a-z0-9-]+\.vercel\.app$' \
            || { echo "::error::APP_ORIGIN debe ser https://<nombre>.vercel.app"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm (la versión de packageManager) y Vercel CLI (versión exacta)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}" "vercel@${VERCEL_CLI_VERSION}"
          pnpm --version
          vercel --version

      - run: pnpm install --frozen-lockfile

      # `postgres` por el pooler de SESIÓN (5432, IPv4: los runners no tienen IPv6). La URL lleva
      # ?sslmode=require. Si falla, el pipeline se detiene y no se despliega nada (R-3).
      - name: Migraciones (prisma migrate deploy)
        env:
          DB_OWNER_URL: ${{ secrets.DB_OWNER_URL }}
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status

      # R65: generate no se conecta; la URL es de relleno, nunca la real.
      - name: Generar el cliente de Prisma
        run: pnpm exec prisma generate --no-hints
        env:
          DB_OWNER_URL: postgresql://x:x@localhost:5432/x

      # `vercel pull` trae la configuración del proyecto. Las variables que baja no hacen falta para
      # compilar (la app valida su config al arrancar, no al compilar): se borran antes del build para
      # que ningún paso posterior las tenga en disco.
      - name: Configuración del proyecto de Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token "${VERCEL_TOKEN}"
          find .vercel -maxdepth 1 -name '.env*' -type f -exec rm -f {} +

      - name: Build (en el runner, Node 26)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "${VERCEL_TOKEN}"

      - name: Desplegar sin asignar el dominio
        id: desplegar
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(vercel deploy --prebuilt --prod --skip-domain --token "${VERCEL_TOKEN}")"
          echo "${URL}" | grep -Eq '^https://[a-z0-9.-]+\.vercel\.app$' \
            || { echo "::error::vercel deploy no devolvió una URL de vercel.app"; exit 1; }
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Despliegue: ${URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Humo contra el despliegue (con bypass de la protección)
        env:
          HUMO_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
        run: bash scripts/despliegue/humo.sh "${{ steps.desplegar.outputs.url }}"

      - name: Promover
        id: promover
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "${{ steps.desplegar.outputs.url }}" --yes --token "${VERCEL_TOKEN}"

      - name: Humo contra el origen estable
        run: bash scripts/despliegue/humo.sh "${APP_ORIGIN}"

      # Hobby solo vuelve al despliegue inmediatamente anterior y, tras un rollback, apaga la
      # asignación automática de dominios: el siguiente despliegue la recupera con `vercel promote` (R-2).
      - name: Rollback si el humo falló después de promover
        if: failure() && steps.promover.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel rollback --yes --token "${VERCEL_TOKEN}" \
            || echo "::error::El rollback falló: hacerlo a mano desde el panel (runbook R-2)"
          echo "Rollback ejecutado tras fallar el humo del origen estable" >> "$GITHUB_STEP_SUMMARY"

      - name: Duración
        if: always()
        run: |
          S=$(( $(date +%s) - T0 ))
          echo "Duración del despliegue a ${{ inputs.entorno }}: $((S / 60)) min $((S % 60)) s" >> "$GITHUB_STEP_SUMMARY"
