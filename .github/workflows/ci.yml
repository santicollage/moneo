# CI de Moneo (F4-02). Corre en Linux lo mismo que los ganchos locales (ADR-015, R59), más la
# auditoría de dependencias, gitleaks y Postgres 17.
#
# Reglas de este archivo (G3-H4, R56). Las verifica tests/politicas/workflows.test.ts:
#   WF-01  toda acción fijada por SHA completo, con la versión en un comentario
#   WF-02  nada de pull_request_target ni workflow_run
#   WF-03  permisos mínimos: contents: read a nivel raíz y ningún permiso de escritura
#   WF-04  checkout siempre con persist-credentials: false
# Solo se usan acciones de GitHub (actions/*). pnpm se instala con npm, sin acción de terceros.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"
  CI: "true"

jobs:
  verificar:
    name: Verificar (Linux, Node 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inicio
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm (la versión de packageManager)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Duración
        if: always()
        run: |
          S=$(( $(date +%s) - T0 ))
          echo "Duración de este job: $((S / 60)) min $((S % 60)) s (límite del pipeline: 10 min, RNF-MAN-02)" >> "$GITHUB_STEP_SUMMARY"

  postgres17:
    name: Postgres 17 (servicio)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Hoy solo prueba que el servicio levanta y que es la versión mayor de Supabase (O-2).
    # Las migraciones y pruebas de integración llegan con F4-03.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-desechable
          POSTGRES_DB: moneo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Versión mayor 17
        env:
          PGPASSWORD: ci-desechable
        run: |
          V="$(psql -h localhost -U postgres -d moneo_ci -Atc 'SHOW server_version_num')"
          echo "server_version_num=${V}"
          test "${V}" -ge 170000 && test "${V}" -lt 180000

  secretos:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (SHA-256 verificado)
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVO="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVO}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVO}" | sha256sum --check --strict
          tar -xzf "${ARCHIVO}" gitleaks

      - name: Buscar secretos en todo el historial
        run: ${{ runner.temp }}/gitleaks git --redact --no-banner --verbose .

  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm (la versión de packageManager)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}"

      # Solo falla con severidad alta o crítica. Un aviso sin arreglo se documenta en
      # `auditConfig` (pnpm-workspace.yaml) con su GHSA y una fecha de revisión; no se ignora en bloque.
      - run: pnpm audit --audit-level high

  # Un solo check obligatorio para la regla de main: si se agrega un job, entra aquí y la regla no cambia.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [verificar, postgres17, secretos, auditoria]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Todos los jobs deben haber pasado
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: ${RESULTADOS}"
          for r in ${RESULTADOS}; do
            test "${r}" = "success" || { echo "::error::Un job no terminó en success"; exit 1; }
          done
