# CI de Moneo (F4-02). Corre en Linux lo mismo que los ganchos locales (ADR-015, R59), más la
# auditoría de dependencias, gitleaks y Postgres 17.
#
# Reglas de este archivo (G3-H4, R56). Las verifica tests/politicas/workflows.test.ts:
#   WF-01  toda acción fijada por SHA completo, con la versión en un comentario
#   WF-02  nada de pull_request_target ni workflow_run
#   WF-03  permisos mínimos: contents: read a nivel raíz y ningún permiso de escritura
#   WF-04  checkout siempre con persist-credentials: false
# Solo se usan acciones de GitHub (actions/*). pnpm se instala con npm, sin acción de terceros.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"
  CI: "true"

jobs:
  verificar:
    name: Verificar (Linux, Node 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inicio
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm (la versión de packageManager)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

      # R65: el cliente de Prisma está en .gitignore y typecheck/build lo necesitan (los tests de
      # tests/pooler-real lo importan). generate no se conecta; la URL es solo de relleno, sin secretos.
      - name: Generar el cliente de Prisma
        run: pnpm exec prisma generate
        env:
          DB_OWNER_URL: postgresql://x:x@localhost:5432/x

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Duración
        if: always()
        run: |
          S=$(( $(date +%s) - T0 ))
          echo "Duración de este job: $((S / 60)) min $((S % 60)) s (límite del pipeline: 10 min, RNF-MAN-02)" >> "$GITHUB_STEP_SUMMARY"

  postgres17:
    name: Postgres 17 (migraciones e integración)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # F4-03a: el servicio es la versión mayor de Supabase (O-2); aquí se aplican las migraciones
    # desde cero y se comprueba que el schema y las migraciones no derivan (R43).
    # F4-03b: las pruebas de la base corren como `moneo_app` (S-1, S-3, CHECK de la parte B y A-1).
    # Sin secretos: las dos contraseñas son desechables y solo existen en este Postgres de usar y tirar.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-desechable
          POSTGRES_DB: moneo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-desechable
      DB_OWNER_URL: postgresql://postgres:ci-desechable@localhost:5432/moneo_ci
      SHADOW_DATABASE_URL: postgresql://postgres:ci-desechable@localhost:5432/moneo_ci_shadow
    steps:
      - name: Versión mayor 17
        run: |
          V="$(psql -h localhost -U postgres -d moneo_ci -Atc 'SHOW server_version_num')"
          echo "server_version_num=${V}"
          test "${V}" -ge 170000 && test "${V}" -lt 180000

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm (la versión de packageManager)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}"

      - run: pnpm install --frozen-lockfile

      - name: Aplicar las migraciones desde cero
        run: pnpm exec prisma migrate deploy

      - name: Estado de las migraciones
        run: pnpm exec prisma migrate status

      - name: Base sombra dedicada
        run: psql -h localhost -U postgres -d moneo_ci -c 'CREATE DATABASE moneo_ci_shadow'

      - name: Las migraciones y el schema no derivan (R43)
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      # La migración crea moneo_app NOLOGIN; LOGIN y contraseña se fijan fuera de ella, por entorno
      # (seguridad.md §6, runbook). Aquí la contraseña es de relleno, como la de postgres.
      - name: Habilitar el login de moneo_app (contraseña desechable)
        run: psql -h localhost -U postgres -d moneo_ci -c "ALTER ROLE moneo_app LOGIN PASSWORD 'ci-desechable-app'"

      # F4-04a (R65): las pruebas de integración importan el cliente de la app (`client.ts`),
      # que vive en .gitignore. DB_OWNER_URL aquí es la desechable del job, no un secreto.
      - name: Generar el cliente de Prisma
        run: pnpm exec prisma generate

      - name: Pruebas de la base como moneo_app (F4-03b)
        env:
          TEST_APP_DATABASE_URL: postgresql://moneo_app:ci-desechable-app@localhost:5432/moneo_ci
          TEST_OWNER_DATABASE_URL: postgresql://postgres:ci-desechable@localhost:5432/moneo_ci
        run: pnpm test:integration

  secretos:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (SHA-256 verificado)
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVO="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVO}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVO}" | sha256sum --check --strict
          tar -xzf "${ARCHIVO}" gitleaks

      - name: Buscar secretos en todo el historial
        run: ${{ runner.temp }}/gitleaks git --redact --no-banner --verbose .

  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm (la versión de packageManager)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}"

      # Solo falla con severidad alta o crítica. Un aviso sin arreglo se documenta en
      # `auditConfig` (pnpm-workspace.yaml) con su GHSA y una fecha de revisión; no se ignora en bloque.
      - run: pnpm audit --audit-level high

  e2e:
    name: E2E y Auth local (Supabase CLI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # F4-05c (P1 = a): Supabase local con la CLI del repo (devDependency, sin acción de terceros).
    # Aplica las migraciones (incluida `signup_gate`: el hook S-7 queda activo por config.toml),
    # corre `auth-local` (Vitest) y E2E-5 (Playwright, Chromium) contra `pnpm start`.
    # Sin secretos: contraseñas, clave HMAC y clave de firma son desechables y viven solo en este job.
    env:
      DB_OWNER_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL: postgresql://moneo_app:ci-desechable-app@127.0.0.1:54322/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      APP_ORIGIN: http://localhost:3000
      RATE_LIMIT_HASH_KEY: ci-desechable-llave-hmac-de-32-caracteres-o-mas
      TEST_SUPABASE_URL: http://127.0.0.1:54321
      TEST_OWNER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      TEST_APP_DATABASE_URL: postgresql://moneo_app:ci-desechable-app@127.0.0.1:54322/postgres
      TEST_MAILPIT_URL: http://127.0.0.1:54324
    steps:
      - name: Inicio
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar pnpm (la versión de packageManager)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}"

      - run: pnpm install --frozen-lockfile

      - name: Clave de firma ES256 desechable (EN-11)
        run: node scripts/ci/generar-clave-firma.mjs supabase/signing_keys.json

      # Solo lo que usan la app y las pruebas: base, Auth (gotrue), Kong, REST y Mailpit.
      - name: Levantar Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,supavisor,realtime,storage-api,postgres-meta,logflare,vector

      # La clave publicable local no es secreta, pero se lee de la CLI en lugar de copiarla aquí:
      # si la CLI la cambia, el job no se queda con una vieja.
      - name: Clave publicable local
        run: |
          KEY="$(pnpm exec supabase status -o env | grep -o 'sb_publishable_[A-Za-z0-9_-]*' | head -n 1)"
          test -n "${KEY}" || { echo "::error::supabase status no trae una clave sb_publishable_"; exit 1; }
          echo "SUPABASE_PUBLISHABLE_KEY=${KEY}" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_PUBLISHABLE_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Aplicar las migraciones (incluye signup_gate)
        run: pnpm exec prisma migrate deploy

      - name: Habilitar el login de moneo_app (contraseña desechable)
        run: psql "${DB_OWNER_URL}" -v ON_ERROR_STOP=1 -c "ALTER ROLE moneo_app LOGIN PASSWORD 'ci-desechable-app'"

      # R65: el cliente de Prisma está en .gitignore; build y pruebas lo necesitan.
      - name: Generar el cliente de Prisma
        run: pnpm exec prisma generate

      - name: Auth real local (auth-local)
        run: pnpm test:auth-local

      - run: pnpm build

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E-5 (Playwright)
        run: pnpm test:e2e

      # Diagnóstico solo si algo falló. Todo es local y desechable (correos @moneo.test), sin datos reales.
      - name: Diagnóstico de Auth y Mailpit (solo si falla)
        if: failure()
        run: |
          echo "::group::Mailpit: correos recibidos (asunto, destinatario, hora)"
          curl -fsS "http://127.0.0.1:54324/api/v1/messages?limit=100" \
            | jq -r '.messages[] | "\(.Created) | \(.Subject) | \(.To[0].Address)"' || true
          echo "::endgroup::"
          echo "::group::Auth: avisos y errores (sin ruido)"
          docker logs supabase_auth_moneo 2>&1 | grep -E '"level":"(warning|error|fatal)"' | cut -c1-400 | head -60 || true
          echo "::endgroup::"
          echo "::group::Auth: solicitudes de confirmación y envíos de correo"
          docker logs supabase_auth_moneo 2>&1 | grep -iE 'confirmation_requested|smtp|mailer|over_email' | cut -c1-300 | head -40 || true
          echo "::endgroup::"

      - name: Duración
        if: always()
        run: |
          S=$(( $(date +%s) - T0 ))
          echo "Duración del job e2e: $((S / 60)) min $((S % 60)) s (R50: si pasa de 10 min, T-10 lo mueve antes de la promoción)" >> "$GITHUB_STEP_SUMMARY"

  # Un solo check obligatorio para la regla de main: si se agrega un job, entra aquí y la regla no cambia.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [verificar, postgres17, e2e, secretos, auditoria]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Todos los jobs deben haber pasado
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: ${RESULTADOS}"
          for r in ${RESULTADOS}; do
            test "${r}" = "success" || { echo "::error::Un job no terminó en success"; exit 1; }
          done
