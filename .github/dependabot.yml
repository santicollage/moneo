# Dependabot (F4-02). Reglas que no son obvias:
#  - npm NO está activo (R62 materializado, 2026-11-12): el actualizador de Dependabot usa Node
#    v24.22.3 y rechaza con `tool_version_not_supported` el `engines.node: 26.x` del proyecto (ADR-015).
#    Mientras tanto: `pnpm audit` en el CI y revisión manual con `pnpm outdated`.
#    Reabrir cuando Dependabot soporte Node 26: restaurar el bloque npm desde el historial de git
#    y volver a exigir el ecosistema npm en tests/politicas/workflows.test.ts.
#  - `cooldown` (2 días en npm, 3 en acciones) debe ser mayor que `minimumReleaseAge` de pnpm (1 día) cuando npm vuelva.
#  - Sin grupos con comodín: un grupo `*` anula el cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
